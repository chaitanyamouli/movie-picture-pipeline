apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 223956247037.dkr.ecr.ap-south-2.amazonaws.com/backend:bcfbd2147f3282626d9e3132c6e1cf10484147ca
          ports:
            - containerPort: 5000
