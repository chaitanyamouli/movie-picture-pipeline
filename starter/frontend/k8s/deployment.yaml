apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 223956247037.dkr.ecr.ap-south-2.amazonaws.com/frontend:bcfbd2147f3282626d9e3132c6e1cf10484147ca
          ports:
            - containerPort: 3000
